  <!-- ===== DYNAMIC STYLESHEET LOADER ===== -->
  <script src="/beats/modules/styleSheets.js"></script>

  <!-- ===== PWA INSTALL SCRIPT ===== -->
  <script>
    (function() {
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
      let deferredPrompt;
      let banner;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (banner) { banner.style.pointerEvents = 'auto'; banner.style.opacity = '1'; }
      });

      banner = document.createElement('div');
      banner.setAttribute('data-overlay', 'install');
      banner.style.pointerEvents = 'none';
      banner.innerHTML = `
        <div class="text">
          <p class="title">Install App</p>
          <p class="desc">Add to Home Screen for fast, full‑screen access</p>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24"><polyline points="7 17 12 22 17 17"/><line x1="12" y1="22" x2="12" y2="2"/></svg>
        </div>
      `;
      document.body.prepend(banner);

      banner.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === 'accepted') banner.remove();
      });

      setTimeout(() => {
        if (banner && banner.parentNode) {
          banner.style.opacity = '0';
          banner.style.pointerEvents = 'none';
          setTimeout(() => { if (banner.parentNode) banner.remove(); }, 250);
        }
      }, 3000);

      window.addEventListener('appinstalled', () => {
        if (banner && banner.parentNode) banner.remove();
      });
    })();
  </script>

  <!-- Static version for cache busting -->
  <meta name="app-version" content="v2024.06">
</head>

<body>

  <!-- The loading bar and initial loader are now styled via main.css -->
  <!-- They are still in the DOM for the JS to control -->
  <div id="loading-bar"></div>

  <!-- Top Navigation -->
  <nav data-navbar="site">
    <div class="wrap">
      <div class="logo">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="white" stroke-width="2.5"/><circle cx="18" cy="16" r="3" stroke="white" stroke-width="2.5"/></svg>
        </div>
        <span class="text">MyBeats<span>™</span></span>
      </div>
      <div class="links">
        <button class="link" data-nav="home">Home</button>
        <button class="link" data-nav="library">Library</button>
        <button class="link" data-nav="favorites">Favorites</button>
        <button class="link" data-nav="playlists">Playlists</button>
      </div>
      <div class="actions">
        <button id="open-search" class="btn" title="Search (Ctrl+K)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
        <button id="theme-toggle" class="themeToggle theme-toggle-btn" title="Toggle Theme">
          <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Breadcrumbs -->
  <div data-navbar="breadcrumbs">
    <div class="trail breadcrumb-trail" id="breadcrumb-trail">
      <div class="wrap breadcrumb-wrapper">
        <div id="breadcrumb-items"></div>
      </div>
    </div>
    <button id="breadcrumb-toggle" class="toggle" title="Toggle breadcrumbs">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path class="chevron chevron-icon" d="M6 9l6 6 6-6"/>
      </svg>
    </button>
  </div>

  <!-- Search Overlay -->
  <div id="search-bar" data-overlay="search" class="hidden">
    <div class="field">
      <input type="text" id="search-input" placeholder="Search songs, artists, albums..." autocomplete="off" autocorrect="off" spellcheck="false">
      <kbd class="kbd">ESC</kbd>
      <button class="close" id="close-search" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="search-results-container" data-search="results" class="hidden"></div>
  </div>

  <!-- Main Content -->
  <main id="main-content">
  </main>

  <!-- Mini Player -->
  <div id="player-bar-container"></div>

  <!-- Player Drawer Overlay -->
  <div class="player-drawer-overlay" id="player-drawer-overlay"></div>
  <div id="full-player-drawer"></div>
  <div id="visualizer-canvas"></div>

  <!-- Modal Overlay -->
  <div data-overlay="modal" id="modal-overlay"></div>
  <div class="modal" id="modal"></div>

  <!-- Toast -->
  <div data-overlay="toast" id="toast"></div>

  <!-- SW Update Notification (future) -->
  <div data-overlay="update"></div>

  <!-- Global Audio Element -->
  <audio id="global-audio" preload="none" crossorigin="anonymous"></audio>

  <!-- ===== SCRIPTS ===== -->

  <script src="/beats/modules/library.js"></script>
  
  <script src="/beats/index.js"></script>


</body>
</html>
